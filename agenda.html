<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--plum:#9a3a8e;--plum-br:#b84bbf;--plum-deep:#5c2b56;--lav:#d6a6e2;--lav-soft:#c79ad4;
    --txt:#e9dbe9;--muted:#a98fa6;--card:#241325;--card2:#2c1930;--line:#3a2640}
  body{font-family:'Figtree',system-ui,-apple-system,sans-serif;color:var(--txt);line-height:1.5;
    background:
      radial-gradient(70% 45% at 100% 0%, rgba(154,58,142,.22) 0, rgba(154,58,142,0) 60%),
      radial-gradient(60% 40% at 0% 100%, rgba(100,45,120,.20) 0, rgba(100,45,120,0) 60%),
      linear-gradient(170deg,#1c0e1c 0%, #140913 100%);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 12px 42px;}
  .card{width:100%;max-width:460px;background:linear-gradient(180deg,#251326,#1b0f1d);border-radius:26px;
    box-shadow:0 22px 60px rgba(0,0,0,.55);overflow:hidden;border:1px solid #3a2640;position:relative}
  .top{position:relative;background:linear-gradient(160deg,#5c2458 0%, #3f1a3d 55%, #2a1228 100%);color:#fff;text-align:center;padding:32px 22px 26px;overflow:hidden}
  .top .deco{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
  .dec{transform-box:fill-box;transform-origin:center}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .f1{animation:floaty 6s ease-in-out infinite}.f2{animation:floaty 8s ease-in-out infinite;animation-delay:-2s}
  .f3{animation:sway 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.dec{animation:none}}
  .top .ring{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;
    background:linear-gradient(135deg,#f3e6f0,#d6b4d4);padding:4px;margin:0 auto 14px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  .top .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .top h1{position:relative;z-index:1;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.72rem;letter-spacing:.01em}
  .top .sub{position:relative;z-index:1;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:#e7d2e4;opacity:.85;margin-top:5px;font-weight:600}
  .body{padding:22px 18px 8px}
  .greet{text-align:center;margin-bottom:18px}
  .greet-hi{font-size:1rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .greet-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:2.9rem;line-height:1.05;margin:2px 0 6px;
    background:linear-gradient(120deg,#f3d9f7 0%,#d6a6e2 45%,#b84bbf 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 18px rgba(184,75,191,.25)}
  .greet-name .gh{-webkit-text-fill-color:initial;color:#c050c6;font-size:1.5rem;vertical-align:middle}
  .greet-sub{font-size:1.02rem;color:var(--lav);font-weight:700}
  .greet-sub.big{font-size:1.1rem}
  .tolbig{display:flex;align-items:center;gap:12px;background:rgba(190,55,55,.14);
    border:1px solid rgba(224,104,104,.38);border-radius:16px;padding:14px 15px;margin-bottom:16px}
  .tolbig .ic{font-size:1.4rem;flex:0 0 auto;width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    background:rgba(224,104,104,.16);border-radius:50%;animation:floaty 1.8s ease-in-out infinite}
  .tolbig .tx{color:#f0b8b8;font-weight:800;font-size:1rem;line-height:1.25}
  .tolbig .tx .nb{white-space:nowrap}
  .tolbig .tx small{display:block;font-weight:600;font-size:.78rem;color:#e3a0a0;opacity:.9;margin-top:2px}
  .when{text-align:center;margin-bottom:18px}
  .when .d{font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:1.4rem;color:#fff;font-weight:700;line-height:1.15;letter-spacing:.01em}
  .when .h{font-size:1.12rem;color:var(--lav);font-weight:800;margin-top:4px}
  .when .wd{display:inline-block;margin-top:8px;font-size:.72rem;color:#fff;background:linear-gradient(135deg,#b84bbf,#8f2f83);
    text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:4px 14px;border-radius:999px}
  .row{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
    border-radius:15px;padding:13px 14px;margin-bottom:10px;font-size:.92rem;color:var(--txt)}
  .row .ic{font-size:1.1rem;line-height:1;flex:0 0 auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:#3a2340;border-radius:50%}
  .row b{color:var(--lav)}
  .copybtn{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:#3a2340;color:#e4c6ef;border:1px solid #553a5e;
    border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit}
  .copybtn:active{transform:translateY(1px)}
  .navttl{display:flex;align-items:center;gap:8px;margin:16px 0 9px;color:var(--lav);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
  .navttl::before,.navttl::after{content:"";height:1px;background:var(--line);flex:1}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .navbtn.full{grid-column:1/-1}
  .navbtn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;padding:13px 10px;
    font-weight:700;font-size:.9rem;text-decoration:none;border:1px solid transparent}
  .navbtn:active{transform:translateY(1px)}
  .navbtn.maps{background:#15303a;color:#8fd0e6;border-color:#27525f}
  .navbtn.waze{background:#152d3d;color:#8ec9ef;border-color:#245066}
  .navbtn.bus{background:#163224;color:#9ad6ab;border-color:#2c583c}
  .navbtn.ride{background:#352414;color:#e4b682;border-color:#5c4328}
  .cta{margin:20px 0 6px;text-align:center}
  .cta-lbl{font-size:.9rem;font-weight:700;color:var(--lav);margin-bottom:11px}
  .btn-main{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:18px;
    padding:19px 18px;font-family:inherit;font-weight:800;font-size:1.18rem;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#c050c6,#8f2f83);box-shadow:0 14px 32px rgba(184,75,191,.42);animation:cpulse 1.8s ease-in-out infinite}
  @keyframes cpulse{0%,100%{transform:scale(1);box-shadow:0 14px 30px rgba(184,75,191,.4)}
    50%{transform:scale(1.035);box-shadow:0 16px 46px rgba(200,80,210,.7), 0 0 0 4px rgba(184,75,191,.12)}}
  @media (prefers-reduced-motion:reduce){.btn-main{animation:none}}
  .btn-g2{display:inline-block;margin-top:12px;color:#8ec9ef;font-weight:600;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
  .ori{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
  .ori h2{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--lav);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .ori ul{list-style:none}
  .ori li{position:relative;padding:8px 0 8px 22px;font-size:.9rem;color:var(--txt);border-bottom:1px solid #2e1f32;line-height:1.45}
  .ori li:last-child{border-bottom:none}
  .ori li::before{content:"";position:absolute;left:3px;top:14px;width:7px;height:7px;background:var(--plum-br);transform:rotate(45deg);border-radius:1px}
  .ori li b{color:var(--lav);font-weight:700}
  .ori.sub h2{color:#e4b682}
  .ori.sub li::before{content:"🏢";background:none;width:auto;height:auto;transform:none;top:8px;left:0;font-size:.7rem;border-radius:0}
  .err{text-align:center;color:#f0a0b0;padding:30px 24px;font-size:.95rem}
  .foot-note{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px;padding-top:4px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:#3a2340;color:#fff;
    padding:11px 20px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:all .25s;pointer-events:none;z-index:9;border:1px solid #553a5e}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

      <g transform="translate(410,54)"><g class="dec f2"><circle r="16" fill="none" stroke="#fff" stroke-width="1.5" opacity=".55"/><circle r="5" fill="#fff" opacity=".4"/></g></g>
      <g transform="translate(400,120)"><g class="dec f3"><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".5"><path d="M3 30 h20"/><path d="M7 30 q-5 -12 4 -19"/><rect x="11" y="-4" width="7" height="14" rx="2.5"/><circle cx="14.5" cy="-8" r="3"/><path d="M11 20 h7"/></g></g></g>

function buildICS(){
  var jsd=new Date(dt.Y,dt.Mo-1,dt.D,dt.H,dt.Mi);

function downloadICS(){
  var ics=buildICS();

  html+='<div class="when"><div class="d">'+dstr+'</div><div class="h">⏰ '+hstr+'</div><div class="wd">'+wd+'</div></div>';
  if(uni){
    html+='<div class="row"><span class="ic">'+(isOn?'💻':'📍')+'</span><div><b>'+(isOn?'Atendimento online':uni)+'</b><br>'+addr+
      (isOn?'':('<br><button class="copybtn" id="btnCopy">📋 Copiar endereço</button>'))+'</div></div>';
  }
  if(uni && !isOn){
    html+='<div class="navttl">Como chegar</div>';
    html+='<div class="nav">'+
      '<a class="navbtn maps" id="btnMaps" target="_blank" rel="noopener">🗺️ Google Maps</a>'+
      '<a class="navbtn waze" id="btnWaze" target="_blank" rel="noopener">🚗 Waze</a>'+
      '<a class="navbtn bus full" id="btnBus" target="_blank" rel="noopener">🚌 Transporte público</a>'+
      '</div>';
  }
  html+='<div class="cta"><div class="cta-lbl">Adicione no seu celular 👇</div>'+
    '<button class="btn-main" id="btnIcs">➕ ADICIONAR AO CALENDÁRIO</button>'+
    '<a class="btn-g2" id="btnG" target="_blank" rel="noopener">ou usar o Google Agenda</a></div>';
  html+='<div class="ori"><h2>📋 Orientações para a consulta</h2><ul>'+ori.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div>';
  if(uni==="Barra da Tijuca"){
    html+='<div class="ori sub"><h2>🏢 Ao chegar na Barra (totem)</h2><ul>'+TOTEM.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div>';
  }
  html+='<div class="foot-note">💜 Suas informações são tratadas com total sigilo.</div>';
  content.innerHTML=html;
  document.getElementById("btnIcs").addEventListener("click",downloadICS);
  document.getElementById("btnG").href=googleUrl();
  if(uni && !isOn){
    document.getElementById("btnMaps").href=mapsUrl();
    document.getElementById("btnWaze").href=wazeUrl();
    document.getElementById("btnBus").href=busUrl();
    var bc=document.getElementById("btnCopy"); if(bc) bc.addEventListener("click",copyAddr);
  }
}
</script>
</body>
</html>
